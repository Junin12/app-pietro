<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="App da Pietro Resolve: clientes, orçamentos, execução com fotos, carteira e documentos.">
  <meta name="theme-color" content="#F5C518">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
