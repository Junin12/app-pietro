<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pietro Resolve · Planilha</title>
  <meta name="description" content="Planilha da Pietro Resolve: serviços, clientes e caixa.">
  <meta name="theme-color" content="#F5C518">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="planilha.css">
</head>
<body>
  <header class="barra">
    <b>Pietro Resolve</b>
    <span id="estado" aria-live="polite"></span>
    <button id="b-menu" type="button" aria-label="Menu">☰</button>
  </header>
  <div id="menu" hidden>
    <button type="button" data-acao="atualizar">🔄 Atualizar dados</button>
    <a href="completo.html">🧰 Abrir o app completo</a>
    <button type="button" data-acao="sair">🚪 Sair</button>
  </div>
  <main id="folha"></main>
  <nav class="abas" id="abas">
    <button type="button" data-aba="servicos">🔧 Serviços</button>
    <button type="button" data-aba="clientes">👤 Clientes</button>
    <button type="button" data-aba="caixa">💰 Caixa</button>
  </nav>
  <div id="mais" hidden></div>
  <dialog id="dialogo"></dialog>
  <div id="aviso" role="status" hidden></div>
  <noscript>Este app precisa do JavaScript ativado.</noscript>
  <script src="planilha.js"></script>
</body>
</html>
